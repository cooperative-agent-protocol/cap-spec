#
# Run TLA+ TLC model checker on every PR that touches the formal models.
# Path-triggered to keep CI fast (TLC takes 5-30 min per spec).

name: formal-tlc

on:
  pull_request:
    paths:
      - "formal/tla/**"
      - ".github/workflows/formal-tlc.yml"

permissions:
  contents: read

jobs:
  tlc:
    name: TLC ${{ matrix.model }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pass-expected fast instances (each must complete with no error).
          - model: TaskState
            config: TaskState.cfg
          - model: ReservationState
            config: ReservationState.cfg
          - model: ReservationState
            config: ReservationState_notimeout_strong.cfg
          - model: MachineMode
            config: MachineMode.cfg
          - model: MachineMode
            config: MachineMode_nofault.cfg
          - model: CAPCoordination
            config: CAPCoordination_safety.cfg
          - model: CAPCoordination
            config: CAPCoordination_N3R2.cfg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download and verify tla2tools.jar (pinned digest)
        run: |
          cd formal/tla
          if [ ! -f tla2tools.jar ]; then
            curl -sL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          fi
          echo "237332bdcc79a35c7d26efa7b82c77c85c2744591c5598673a8a45085ff2a4fb  tla2tools.jar" | sha256sum -c -
      - name: Run TLC for ${{ matrix.model }}
        run: |
          cd formal/tla
          java -jar tla2tools.jar -config ${{ matrix.config }} ${{ matrix.model }}.tla
  # The negative results (CAPCoordination_live_N2R1_retry,
  # ReservationState_notimeout) and the large symmetric sweep
  # (N4R2, N5R2) are reproduced locally via ./run_sweep.sh and recorded in
  # RESULTS.md; they are not in the always-green matrix above.
