\* The refinement at the composite model's N=4 sweep (2 exc + 2 dump), R=2, as CAPCoordination_N4R2_nosym.cfg: every
\* step maps to an abstract step or a stutter. No symmetry reduction.
SPECIFICATION Spec
CONSTANTS
    Excavators = {e1, e2}
    Dumps = {d1, d2}
    Resources = {r1, r2}
    MaxTasks = 2
    QueuedGrants = FALSE
    EnableHandover = FALSE
    AtomicHandover = TRUE
    AllowTransfer = TRUE
    AllowDeny = TRUE
PROPERTIES
    RefinesReservation
    RefinesHandover
CHECK_DEADLOCK FALSE
