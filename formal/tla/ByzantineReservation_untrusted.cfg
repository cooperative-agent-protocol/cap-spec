\* Untrusted-arbiter (naive) design: the system honours a machine's self-asserted
\* hold without an authoritative arbiter check. Expect: NoTwoActuators VIOLATED ---
\* a lying machine and the arbiter's true grantee both actuate the same resource.
\* This shows the architecture's exclusivity rests on the trusted arbiter, not on
\* agent good behaviour.
SPECIFICATION Spec
CONSTANTS
    Machines = {"m1", "m2"}
    Resources = {"LP-1"}
    TrustedArbiter = FALSE
INVARIANTS
    TypeOK
    ArbiterExclusive
    NoTwoActuators
CHECK_DEADLOCK FALSE
