\* Acquisition order ENFORCED: a machine acquires needed resources in the total
\* order, so circular wait is impossible. Expect: deadlock-free (no error).
SPECIFICATION Spec
CONSTANTS
    Machines = {"m1", "m2"}
    Resources = {1, 2}
    ResourceOrder = TRUE
INVARIANTS
    TypeOK
    HoldsOwnerConsistent
    NoDoubleOwner
CHECK_DEADLOCK TRUE
