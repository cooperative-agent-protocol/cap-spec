\* Canonical safety regression: 1 excavator + 1 dump, 1 resource, taskCount
\* bounded to 2. Reproduces the original 802-distinct-state result under the
\* generalised spec (semantic-preservation gate). Run by CI.
SPECIFICATION Spec

CONSTANTS
    Excavators = {"exc1"}
    Dumps = {"dump1"}
    Resources = {"LP-1"}
    MaxTasks = 3
    QueuedGrants = FALSE
    EnableHandover = FALSE
    AtomicHandover = TRUE

CONSTRAINT
    BoundedTaskCount

INVARIANTS
    TypeOK
    NoDoubleGrant
    HolderConsistent
    TargetConsistent

CHECK_DEADLOCK FALSE
