\* The refinement at the composite model's N=5 sweep (3 exc + 2 dump), R=2, as CAPCoordination_N5R2.cfg, reduced by
\* the same symmetry (machines of one role and the resources are interchangeable; the refinement mapping and the
\* abstract models treat every machine and resource alike, so checking the steps from one state of each orbit covers
\* every step). Safety properties only.
SPECIFICATION Spec
CONSTANTS
    Excavators = {e1, e2, e3}
    Dumps = {d1, d2}
    Resources = {r1, r2}
    MaxTasks = 2
    QueuedGrants = FALSE
    EnableHandover = FALSE
    AtomicHandover = TRUE
    AllowTransfer = TRUE
    AllowDeny = TRUE
SYMMETRY Symm
PROPERTIES
    RefinesReservation
    RefinesHandover
CHECK_DEADLOCK FALSE
