\* Trusted arbiter: actuation is gated by the arbiter's authoritative holder map,
\* so a machine's false self-claim carries no authority. Expect: NoTwoActuators
\* HOLDS even though a machine may lie.
SPECIFICATION Spec
CONSTANTS
    Machines = {"m1", "m2"}
    Resources = {"LP-1"}
    TrustedArbiter = TRUE
INVARIANTS
    TypeOK
    ArbiterExclusive
    NoTwoActuators
CHECK_DEADLOCK FALSE
