\* P4 (handover receiver ownership), ATOMIC transfer, WITH a potential thief:
\* exc1 hands LP-1 to dump1 while exc2 is also queued for LP-1. Atomic transfer
\* leaves no free window, so exc2 cannot steal the load point mid-handover.
\* Expect: HOLDS.
SPECIFICATION Spec
CONSTANTS
    Excavators = {"exc1", "exc2"}
    Dumps = {"dump1"}
    Resources = {"LP-1"}
    MaxTasks = 1
    QueuedGrants = TRUE
    EnableHandover = TRUE
    AtomicHandover = TRUE
INVARIANTS
    TypeOK
    NoDoubleGrant
    HolderConsistent
    TargetConsistent
    HandoverReceiverOwnership
CHECK_DEADLOCK FALSE
