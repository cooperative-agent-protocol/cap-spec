\* P4 (handover receiver ownership), ATOMIC transfer, minimal instance:
\* 1 excavator (sender) hands LP-1 to 1 dump (receiver). Queued regime so the
\* receiver waits in REQUESTED for the handover. Expect: HOLDS.
SPECIFICATION Spec
CONSTANTS
    Excavators = {"exc1"}
    Dumps = {"dump1"}
    Resources = {"LP-1"}
    MaxTasks = 1
    QueuedGrants = TRUE
    EnableHandover = TRUE
    AtomicHandover = TRUE
INVARIANTS
    TypeOK
    NoDoubleGrant
    HolderConsistent
    TargetConsistent
    HandoverReceiverOwnership
CHECK_DEADLOCK FALSE
