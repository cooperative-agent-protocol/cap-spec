\* Epoch volatile: resets to 0 on restart. A re-grant re-issues an epoch that can
\* collide with a stale pre-crash token, so two machines validate. Expect:
\* ExclusiveActuation VIOLATED (the model-checked reason recovery must persist the epoch).
SPECIFICATION Spec
CONSTANTS
    Machines = {"m1", "m2"}
    Resources = {"LP-1"}
    MaxEpoch = 4
    PersistEpoch = FALSE
INVARIANTS
    TypeOK
    ExclusiveActuation
CHECK_DEADLOCK FALSE
