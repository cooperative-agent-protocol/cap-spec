\* Fencing ON: a monotonic grant epoch (fencing token) is enforced on actuation,
\* so a stale holder (lost expiry notification) cannot act. Expect: HOLDS.
SPECIFICATION Spec
CONSTANTS
    Machines = {"m1", "m2"}
    Resources = {"LP-1"}
    MaxEpoch = 3
    Fenced = TRUE
INVARIANTS
    TypeOK
    ExclusiveActuation
CHECK_DEADLOCK FALSE
