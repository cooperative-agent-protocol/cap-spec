\* No acquisition order: a machine may grab needed resources in any order, so
\* hold-and-wait admits a circular-wait DEADLOCK (m1 holds 1 waits 2; m2 holds 2
\* waits 1). Expect: TLC reports a deadlock (the negative result motivating the
\* acquisition-order discipline).
SPECIFICATION Spec
CONSTANTS
    Machines = {"m1", "m2"}
    Resources = {1, 2}
    ResourceOrder = FALSE
INVARIANTS
    TypeOK
    HoldsOwnerConsistent
    NoDoubleOwner
CHECK_DEADLOCK TRUE
