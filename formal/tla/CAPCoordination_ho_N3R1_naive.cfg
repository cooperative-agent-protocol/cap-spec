\* P4 NEGATIVE RESULT: NAIVE release-then-regrant handover.
\* exc1 hands LP-1 to dump1 (receiver) but releases r BEFORE the receiver is
\* re-granted, opening an IN_PROGRESS window in which r is unheld (and a third
\* machine, exc2, can grab it). Expect: HandoverReceiverOwnership VIOLATED
\* (the other invariants still hold -- non-atomicity breaks ownership, not the
\* no-double-grant safety). This justifies the atomic-transfer requirement.
SPECIFICATION Spec
CONSTANTS
    Excavators = {"exc1", "exc2"}
    Dumps = {"dump1"}
    Resources = {"LP-1"}
    MaxTasks = 1
    QueuedGrants = TRUE
    EnableHandover = TRUE
    AtomicHandover = FALSE
INVARIANTS
    TypeOK
    NoDoubleGrant
    HolderConsistent
    TargetConsistent
    HandoverReceiverOwnership
CHECK_DEADLOCK FALSE
