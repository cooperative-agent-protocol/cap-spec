\* No deadline guarantee (time may pass without the timeout firing): a pending
\* handover ages past Deadline. Expect: BoundedResolution VIOLATED --- the
\* difference between an unbounded "eventually" and a bounded-time guarantee.
SPECIFICATION Spec
CONSTANTS
    Deadline = 3
    Enforced = FALSE
INVARIANTS
    TypeOK
    BoundedResolution
CHECK_DEADLOCK FALSE
