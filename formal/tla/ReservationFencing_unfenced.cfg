\* Fencing OFF: no epoch check. After a lost expiry notification and a re-grant,
\* a stale holder and the new holder both actuate the same resource. Expect:
\* ExclusiveActuation VIOLATED (model-checked counterpart of the fault-injection
\* "dropped ReservationStatus -> exclusivity violation" finding).
SPECIFICATION Spec
CONSTANTS
    Machines = {"m1", "m2"}
    Resources = {"LP-1"}
    MaxEpoch = 3
    Fenced = FALSE
INVARIANTS
    TypeOK
    ExclusiveActuation
CHECK_DEADLOCK FALSE
