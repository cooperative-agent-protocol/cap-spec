\* Supervisor has NO priority: the protocol's authorization drives motion and the
\* supervisor cannot stop a moving machine. Expect: InhibitStops VIOLATED -- the
\* protocol moves a machine while it is inhibited (shows why Layer C must have
\* priority + immediate-stop authority over the protocol/LLM).
SPECIFICATION Spec
CONSTANTS
    Machines = {"m1", "m2"}
    SupervisorPriority = FALSE
INVARIANTS
    TypeOK
    InhibitStops
CHECK_DEADLOCK FALSE
