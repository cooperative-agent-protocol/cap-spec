\* Epoch persisted across arbiter restart (stable monotonic counter). A post-crash
\* re-grant carries an epoch above every pre-crash token, so a stale holder is
\* fenced. Expect: ExclusiveActuation HOLDS.
SPECIFICATION Spec
CONSTANTS
    Machines = {"m1", "m2"}
    Resources = {"LP-1"}
    MaxEpoch = 4
    PersistEpoch = TRUE
INVARIANTS
    TypeOK
    ExclusiveActuation
CHECK_DEADLOCK FALSE
