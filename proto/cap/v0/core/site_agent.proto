syntax = "proto3";

package cap.v0.core;

import "cap/v0/core/common.proto";
import "cap/v0/core/skill.proto";

option java_multiple_files = true;
option java_package = "io.cap.v0";

// ─── Site Agent → Machine Agent ──────────────────────────────────────

// WorkOrder assigns a skill-level task to a specific machine.
// The typed fields (skill, zones, parameters, constraints, success_criteria)
// are the normative contract. human_context is supplementary NL for context.
message WorkOrder {
  string task_id           = 1;
  string work_package_id   = 2;
  string target_machine_id = 3;

  // Machine-agnostic skill name, e.g. "excavate_batch", "load_truck",
  // "haul_route", "dump_material", "safe_wait".
  string skill             = 4;

  GeoZoneRef target_zone      = 5;
  GeoZoneRef source_zone      = 6;
  GeoZoneRef destination_zone = 7;

  // DEPRECATED (RFC-0001): 型なし string blob。型付きパラメータは `invocation.typed_params`
  // (SkillInvocation の google.protobuf.Any) に domain message として載せること。
  // free-form なメタ情報のみ当面ここに残してよい。
  map<string, string> parameters = 8 [deprecated = true];

  repeated Constraint preconditions      = 9;
  repeated Constraint safety_constraints = 10;

  TimeWindow execution_window = 11;
  int32 priority              = 12;

  // Success criteria — machine-verifiable conditions for task completion.
  // e.g. "moved_volume_m3 >= 10.0", "zero_safety_violation".
  repeated string success_criteria = 13;

  // Supplementary natural language context from the Site Agent or user.
  // NOT the normative contract — typed fields above take precedence.
  string human_context = 14;

  // RFC-0001: 型付きアクション契約。`skill` (string) + `parameters` (deprecated string map) を
  // 置き換える。`invocation.typed_params` (google.protobuf.Any) が domain-specific な typed
  // パラメータ (例 cap.v0.domains.construction.ExcavateBatchParams) を運び、新 Domain Pack が
  // CAP-Core を変更せず拡張できる。移行期は skill/parameters と併存 (dual-write 推奨)。
  SkillInvocation invocation = 15;

  // Fencing token for re-dispatch idempotency: a monotonically increasing
  // per-task assignment epoch. CAP delivery is at-least-once, so a WorkOrder
  // may be re-sent after a lost WorkOrderAck. A machine MUST treat a WorkOrder
  // whose task_id is already in a non-terminal state as an idempotent no-op
  // (re-emit the last WorkOrderAck), never a second execution; the epoch lets
  // it distinguish a genuine re-assignment from a duplicate.
  uint64 assignment_epoch = 16;
}

// CancelWorkOrder requests cancellation of a previously issued work order.
message CancelWorkOrder {
  string task_id = 1;
  string reason  = 2;
}

// ReservationRequest asks to reserve a shared resource (zone, load point,
// route segment) for exclusive use.
message ReservationRequest {
  string reservation_id = 1;
  string resource_id    = 2;
  string holder_id      = 3;
  TimeWindow requested_window = 4;
  string reason         = 5;

  // Arbitration priority for the queued regime (higher = served earlier within
  // FIFO-with-priority). Optional; default 0.
  int32 priority        = 6;

  // Whether this reservation may be preempted by a higher-priority request.
  bool preemptable      = 7;
}

// ReservationRelease frees a previously granted reservation.
message ReservationRelease {
  string reservation_id = 1;
  string reason         = 2;
}

// ModeCommand requests a machine to transition to a different operating mode.
message ModeCommand {
  string machine_id        = 1;
  MachineMode requested_mode = 2;
  string reason            = 3;

  // Fencing token for mode arbitration: a monotonically increasing per-machine
  // mode-command epoch. The machine MUST ignore a ModeCommand whose epoch is
  // older than the last one it applied, so a stale, reordered, or replayed
  // ModeCommand cannot override a newer one (critical for AUTONOMY transitions).
  uint64 mode_epoch        = 4;
}
